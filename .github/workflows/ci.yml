name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extras: "dev,mnemonic"
          - python-version: "3.12"
            extras: "dev,mnemonic"
          # bip32 caps coincurve below 21, and coincurve 20 ships no 3.13 wheel,
          # so the mnemonic extra tries to build coincurve from source and dies
          # inside scikit-build-core. The core package installs fine here because
          # coincurve 21 does have a 3.13 wheel, and the mnemonic tests skip
          # themselves via importorskip, so 3.13 still gets a real run.
          - python-version: "3.13"
            extras: "dev"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[${{ matrix.extras }}]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy src
      - name: Test (pytest + coverage)
        run: pytest --cov=nsec_tree --cov-report=term-missing --cov-fail-under=90
      - name: Verify from_mnemonic errors cleanly without the extra
        run: |
          pip uninstall -y mnemonic bip32
          python -c "
          import nsec_tree
          try:
              nsec_tree.from_mnemonic('abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about')
              raise SystemExit('expected NsecTreeError')
          except nsec_tree.errors.NsecTreeError as e:
              assert 'nsec-tree[mnemonic]' in str(e); print('ok:', e)"
